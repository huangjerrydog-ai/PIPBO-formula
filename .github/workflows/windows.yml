name: Build Windows package
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-build.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-build.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Build and smoke test executable
        run: python build_windows.py
      - name: Upload Windows ZIP and checksum
        uses: actions/upload-artifact@v4
        with:
          name: PIPBO-formula-windows-x64
          path: |
            release/*.zip
            release/*.sha256
          if-no-files-found: error
          retention-days: 30
